# openspec/config.yaml — CellAgent (SCAI) SDD Configuration
# Generated by sdd-init on 2026-05-28
schema: spec-driven

context: |
  Stack: Python 3.12, scanpy 1.12.1, muon 0.1.7, squidpy 1.8.1,
         spatialdata 0.7.3, mudata 0.3.8, leidenalg 0.12.0,
         pandoc + typst (PDF reports)
  Architecture: OpenCode orchestrator + 8 specialist agents
    (data, qc, normalize, cluster, integration, spatial, report, trace).
    Pipeline state shared as JSON dict between stages. Engram for
    cross-session memory. Skills-based delegation.
  Testing: No test runner, no test files, no CI pipeline.
           strict_tdd is DISABLED.
  Style: Conventional commits, English artifacts, LLM-first skill format
         with frontmatter (name, description, trigger).
  Env: Conda env 'cellagent', Docker, Singularity.

session:
  mode: interactive
  ask_always: true
  review_budget_lines: 400

rules:
  proposal:
    - Include rollback plan for risky changes
    - State the pipeline stage scope (unimodal / multimodal / spatial)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference specific scanpy/muon/squidpy APIs where relevant
  design:
    - Include data flow diagrams where needed
    - Document architecture decisions with rationale
    - Reference PipelineState schema from skills/_shared/pipeline-state.md
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing skill patterns (frontmatter + body)
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "conda env create -f environment.yml"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: null
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  linter: false
  type_checker: false
  formatter: false
