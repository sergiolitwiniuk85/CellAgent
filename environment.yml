# CellAgent — Conda environment
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml
# Export:  conda env export --no-builds > environment.yml

name: cellagent
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy=1.12.1
  - muon=0.1.7
  - squidpy=1.8.1
  - spatialdata=0.7.3
  - spatialdata-plot=0.3.4
  - mudata=0.3.8
  - leidenalg=0.12.0
  - pandoc=3.1
  - pip
  - pip:
    - typst>=0.12
  # Optional: GPU-accelerated
  # - rapids-singlecell
  # HPC support
  # - dask
  # - distributed
